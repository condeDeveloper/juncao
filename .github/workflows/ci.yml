name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.so }}

    # bash nos tres sistemas: no Windows o shell padrao e o PowerShell, e ele
    # desmonta "-Dexec.args=..." em dois argumentos antes de o Maven ver.
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Testes
        run: mvn -B -ntp verify

      - name: toda juncao devolve o mesmo resultado
        run: mvn -B -ntp -q exec:java -Dexec.args="correcao"

      - name: o custo por tamanho
        run: mvn -B -ntp -q exec:java -Dexec.args="tamanho"

      - name: chaves repetidas quebram o espalhamento
        run: mvn -B -ntp -q exec:java -Dexec.args="repeticao"

      - name: o espalhamento cru contra o bom
        run: mvn -B -ntp -q exec:java -Dexec.args="espalhamento"

      - name: quando a entrada ja vem ordenada
        run: mvn -B -ntp -q exec:java -Dexec.args="ordenada"

      - name: quando o resultado e grande, a escolha some
        run: mvn -B -ntp -q exec:java -Dexec.args="resultado"

      - name: Relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.so }}
          path: target/surefire-reports
